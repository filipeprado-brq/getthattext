<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <title>Dicionário</title>
    <link rel="stylesheet" href="./base.css" />
    <link rel="stylesheet" href="./editor.css" />
  </head>
  <body>
    <!--
      O editor de dicionário. A metade de cima existe para você não precisar
      lembrar de cabeça como o Whisper escreveu errado: o cru fica na tela e
      você clica no erro.

      O texto mostrado é o CRU, não o reescrito. Tem que ser: no reescrito os
      termos já saíram certos, e não sobraria erro em que clicar.
    -->
    <main>
      <div class="head-row">
        <h1>Como o Whisper ouviu</h1>
        <span class="when" id="when"></span>
      </div>
      <p id="hint">
        O texto cru, antes do dicionário e antes da reescrita — o único lugar
        onde o erro ainda aparece. Clique na palavra errada; clique numa
        segunda para pegar o trecho inteiro.
      </p>
      <div id="heard-text" aria-label="transcrição crua"></div>

      <form id="learn"></form>

      <div class="head-row list">
        <h1>Termos</h1>
        <span class="count" id="count"></span>
        <button id="add-blank" type="button">Novo termo</button>
      </div>
      <div class="terms">
        <div class="terms-head">
          <span>Correto</span>
          <span>Como foi ouvido</span>
          <span>Contexto</span>
          <span aria-hidden="true"></span>
        </div>
        <div id="list"></div>
      </div>
    </main>

    <footer>
      <p id="status" role="status"></p>
    </footer>

    <script type="module" src="./editor.js"></script>
  </body>
</html>
